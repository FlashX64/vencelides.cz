baseURL = "https://www.vencelides.cz/"
title = "Filip Vencelides | Software Engineer ⸱ Game Dev Enthusiast"
languageCode = "en-us"
enableRobotsTXT = true

# Keep project tag metadata, but do not publish category/tag indexes or term pages
disableKinds = ["taxonomy", "term"]

[outputs]
  page = ["HTML"]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[module]
[[module.mounts]]
source = "assets"
target = "assets"
[[module.mounts]]
source = "node_modules/bootstrap/scss"
target = "assets/scss/bootstrap"

[params]
title = 'Filip Vencelides | Software Engineer ⸱ Game Dev Enthusiast'
description = 'Game development student and 3D tooling developer based in Brno, with a decade of experience in game modding and a background in real-world 3D software development.'
images = ['/img/og-preview.png']

[params.seo]
[params.seo.person]
name = "Filip Vencelides"
url = "https://www.vencelides.cz/"
image = "/img/og-preview.png"
sameAs = [
  "https://linkedin.com/in/filip-vencelides",
  "https://github.com/flashx64"
]

# If you want to display an image logo in the header, you can add it here
# logo = '/img/hugo.svg'


[params.favicons]
# Optional: provide a different source image for auto-generation
source = "icons/favicon.png"

[languages]
[languages.en]
disabled = false
languageCode = 'en-us'
languageDirection = 'ltr'
languageName = 'English'
weight = 0

# [languages.en.menus]
# [[languages.en.menus.header]]
# name = "Home"
# URL = "/"
# weight = 1
[[languages.en.menus.header]]
name = 'About'
URL = '#about'
weight = 2
[[languages.en.menus.header]]
name = 'Portfolio'
URL = '#portfolio'
weight = 3
#  [[languages.en.menus.header]]
#  name = "Experience"
#  URL = "#experience"
#  weight = 4
[[languages.en.menus.header]]
name = 'Skills'
URL = '/skills'
weight = 5

[[languages.en.menus.header]]
pre = "search"
name = "Search"
URL = "/search"
weight = 6

[[languages.en.menus.footer]]
name = "Home"
URL = "/"
weight = 1

[[languages.en.menus.footer]]
name = "About"
URL = "#about"
weight = 2

[[languages.en.menus.footer]]
name = "Projects"
URL = "/projects"
weight = 3

[[languages.en.menus.footer]]
name = "Skills"
URL = "/skills"
weight = 4

# Theme appearance
[params.colorTheme]

## the following configuration would disable automatic theme selection
[params.colorTheme.auto]
disable = true

[params.colorTheme.forced]
theme = "dark"

## the following parameter will disable theme override in the footer
#  [params.colorTheme.selector.disable]
#  footer = true


[params.colorTheme.selector.disable]
footer = false
header = false
mobileHeader = true
## by default we allow override AND automatic selection


# Performance optimizations
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    lineNos = false
    style = "github"

[imaging]
  resampleFilter = "Lanczos"
  quality = 85
  anchor = "Smart"

[minify]
  disableCSS = false
  disableHTML = false
  disableJS = false
  disableJSON = false
  disableSVG = false
  disableXML = false
  minifyOutput = true
  [minify.tdewolff]
    [minify.tdewolff.html]
      keepDefaultAttrVals = true
      keepWhitespace = false
    [minify.tdewolff.css]
      precision = 0
    [minify.tdewolff.js]
      precision = 0
