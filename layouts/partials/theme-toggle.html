<button class="theme-toggle" type="button" data-theme-toggle>
  <span class="theme-toggle-to-light">
    <span aria-hidden="true">{{ partial "icon.html" "sun" }}</span>
    <span class="visually-hidden">Switch to light theme</span>
  </span>
  <span class="theme-toggle-to-dark">
    <span aria-hidden="true">{{ partial "icon.html" "moon" }}</span>
    <span class="visually-hidden">Switch to dark theme</span>
  </span>
</button>
