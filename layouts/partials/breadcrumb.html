<section id="breadcrumb-bar" class="breadcrumb-bar container">
  <nav aria-label="Breadcrumb" class="d-print-none">
    <ol class="site-breadcrumbs">
      {{ range .Ancestors.Reverse }}
        <li class="site-breadcrumbs-item">
          <a href="{{ .RelPermalink }}">
            {{ if .IsHome }}
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
                <path d="M3 11.5 12 4l9 7.5v8a1 1 0 0 1-1 1h-5.5a1 1 0 0 1-1-1v-5h-3v5a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/>
              </svg>
            {{ end }}
            <span>{{ if .IsHome }}Home{{ else }}{{ .Title }}{{ end }}</span>
          </a>
        </li>
      {{ end }}
      <li class="site-breadcrumbs-item" aria-current="page"><span>{{ .Title }}</span></li>
    </ol>
  </nav>
</section>
