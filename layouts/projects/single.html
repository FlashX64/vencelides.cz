{{ define "main" }}
<article class="project-page" id="main-content" tabindex="-1">
  <aside class="project-outline">
    <a class="project-back" href="{{ "projects/" | relURL }}">← All projects</a>
    <details open>
      <summary>On this page</summary>
      <div class="project-outline-links">
        <a href="#project-overview">Overview</a>
        {{ .TableOfContents }}
      </div>
    </details>
  </aside>
  <div class="project-reading">
    <header class="project-heading" id="project-overview">
      <p class="project-eyebrow">{{ with .Params.type }}{{ . }} · {{ end }}{{ .Date.Format "2006" }}</p>
      <h1>{{ .Title }}</h1>
      {{ partial "tags.html" (dict "tags" .Params.tags) }}
    </header>
    <div class="project-prose">{{ .Content }}</div>
  </div>
</article>
{{ partial "script.html" "project-page" }}
{{ end }}
